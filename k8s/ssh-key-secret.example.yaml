# ssh-key-secret.example.yaml
#
# The one deployment-wide SSH private key this tool uses to reach every instance it manages
# -- never a per-instance stored credential; see docs/INSTANCE-SCHEDULER-DEFINITIVE-
# GUIDE.html's security section for the full design. This is a FILE, not an env var,
# because the tool shells out to the real `ssh` binary with `-i <path>` -- it has to exist
# on disk at a real path, which is why it's a Secret mounted as a volume
# (k8s/deployment.yaml), not a stringData key folded into secret.example.yaml above.
#
# Copy this file to ssh-key-secret.yaml (gitignored -- never commit the real one) and paste
# in your real private key. Prefer creating it directly instead, so the key material never
# touches a file on your own machine longer than necessary:
#   kubectl create secret generic linode-instance-scheduler-ssh-key \
#     -n linode-instance-scheduler \
#     --from-file=linode_spike_key=/path/to/your/private_key
#
# The customer's own job here is only to trust the matching PUBLIC key -- baked into your
# golden image at build time (Path A), or added to an existing instance's authorized_keys
# out-of-band (Path B). This Secret holds the PRIVATE half; nothing about generating or
# distributing the public half is specific to Kubernetes -- see README.md/docs/customer-
# guide.md for that, same as the VM deployment.
apiVersion: v1
kind: Secret
metadata:
  name: linode-instance-scheduler-ssh-key
  namespace: linode-instance-scheduler
type: Opaque
stringData:
  # Key name here (linode_spike_key) must match what k8s/deployment.yaml mounts and points
  # LINODE_SSH_KEY_PATH at -- change both together if you rename it.
  linode_spike_key: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE THIS ENTIRE BLOCK WITH YOUR REAL PRIVATE KEY CONTENTS
    -----END OPENSSH PRIVATE KEY-----
