# deployment.yaml
#
# Runs the scheduler (`poll`) and the REST API + dashboard (`serve-api`) as two containers
# in ONE pod, behind a Deployment pinned to exactly one replica. Both of those choices are
# load-bearing, not arbitrary -- read this whole comment block before changing either.
#
# WHY ONE REPLICA, ALWAYS (do not scale this Deployment):
# This tool's own concurrency model (instance_manager.py's `_instance_lock()`) is a
# per-instance `fcntl` file lock plus a local SQLite database -- correct and safe for any
# number of *processes on one host/filesystem*, but it explicitly assumes there is never a
# second, independently-running
# poller: "two pollers racing to fire the same schedule without real distributed
# coordination is a correctness risk, not a safety net." A ReplicaSet with replicas > 1, or
# a RollingUpdate strategy that briefly runs an old and a new pod side by side, would create
# exactly that second poller. `strategy.type: Recreate` below (old pod fully terminated
# before a new one starts) plus `replicas: 1` is what keeps this tool's own core safety
# guarantee true on Kubernetes -- it is NOT an arbitrary resource-sizing choice, and it also
# happens to be required by the ReadWriteOnce PVC (k8s/pvc.yaml) anyway, since a genuine
# RollingUpdate would deadlock waiting for a volume already attached to the pod it's trying
# to replace.
#
# WHY TWO CONTAINERS IN ONE POD, NOT TWO SEPARATE DEPLOYMENTS:
# Both `poll` and `serve-api` read and write the exact same state (the SQLite registry, the
# per-instance lock files, known_hosts) -- `serve-api` calls the same library functions
# (`start_instance()`, `stop_instance()`, etc.) the poller does, taking the same locks. Two
# separate Deployments would need their own PVC each (breaking the single source of truth)
# or would both try to mount the one ReadWriteOnce PVC from potentially different nodes
# (unsupported -- RWO binds to a single node). Putting both containers in the same pod
# means Kubernetes guarantees they're on the same node, so sharing one PVC mount between
# them is trivially safe -- the same trust boundary the VM deployment guide already relies
# on (both processes as siblings on one host, one filesystem).
#
# ${IMAGE} below is a literal placeholder, not a real value -- k8s/deploy-lke.sh substitutes
# it via `envsubst` before applying this file, the same convention the sibling
# Linode-LKE-Private-Network project uses for its own `${ETCD_ENDPOINTS}` placeholder in its
# own orchestration script. If you ever `kubectl apply -f` this file directly instead of
# through deploy-lke.sh, you must `export IMAGE=...` and pipe through `envsubst '${IMAGE}'`
# yourself first, or Kubernetes will try to pull an image
# literally named "$IMAGE" and fail.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linode-instance-scheduler
  namespace: linode-instance-scheduler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linode-instance-scheduler
  template:
    metadata:
      labels:
        app: linode-instance-scheduler
    spec:
      # Matches the Dockerfile's own scheduler:scheduler (uid/gid 1000) user. fsGroup is
      # what actually makes a freshly-provisioned, empty PersistentVolume writable by that
      # non-root user the first time it's mounted -- a build-time chown on the image's own
      # state/ directory (see Dockerfile) has no effect on a real volume mounted over it at
      # runtime; this is the mechanism that does.
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: scheduler
          image: ${IMAGE}
          # --interval-seconds/--window-seconds aren't read from the environment by the CLI
          # itself (they're plain argparse flags, unlike LINODE_API_TOKEN etc. below) --
          # POLL_INTERVAL_SECONDS/POLL_WINDOW_SECONDS from the ConfigMap are wired into real
          # flags here via a small shell wrapper, which is also why this container needs an
          # explicit command/args pair instead of relying on the image's own ENTRYPOINT/CMD.
          command: ["/bin/sh", "-c"]
          args:
            - >-
              exec python3 instance_manager.py poll
              --interval-seconds "${POLL_INTERVAL_SECONDS:-300}"
              --window-seconds "${POLL_WINDOW_SECONDS:-300}"
          envFrom:
            - secretRef:
                name: linode-instance-scheduler-secrets
            - configMapRef:
                name: linode-instance-scheduler-config
          env:
            - name: LINODE_SSH_KEY_PATH
              value: /etc/linode-scheduler/ssh/linode_spike_key
          volumeMounts:
            - name: state
              mountPath: /app/state
            - name: ssh-key
              mountPath: /etc/linode-scheduler/ssh
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

        - name: api
          image: ${IMAGE}
          command: ["/bin/sh", "-c"]
          args:
            - exec python3 instance_manager.py serve-api --host 0.0.0.0 --port 8000
          envFrom:
            - secretRef:
                name: linode-instance-scheduler-secrets
            - configMapRef:
                name: linode-instance-scheduler-config
          env:
            - name: LINODE_SSH_KEY_PATH
              value: /etc/linode-scheduler/ssh/linode_spike_key
          ports:
            - name: http
              containerPort: 8000
          volumeMounts:
            - name: state
              mountPath: /app/state
            - name: ssh-key
              mountPath: /etc/linode-scheduler/ssh
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: linode-instance-scheduler-state
        - name: ssh-key
          secret:
            secretName: linode-instance-scheduler-ssh-key
            defaultMode: 0400
